<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Empleado - Gestión de Incidencias</title>

    <link rel="stylesheet" href="pantallas.css">
</head>

<body>
    <header>
        <h1>Portal del Empleado Municipal</h1>
        <div>
            <span id="nombre-usuario">Usuario: Juan Perez</span>
            <button type="button" id="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <main>
        <section>
            <h2>Mis Incidencias Reportadas</h2>
            <button type="button" id="btn-nueva-incidencia">+ Nueva Incidencia</button>
            <button type="button" id="btn-ver-incidencias">&#x21BB; Actualizar</button>
        </section>
        <section>
            <table border="1" cellpadding="8" cellspacing="0" width="100%">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Artículo / Elemento</th>
                        <th>Descripción</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-incidencias">
                </tbody>
            </table>
        </section>

        <section id="seccion-crear-incidencia" style="display: none;">
            <h3>Reportar Nueva Incidencia</h3>
            <form id="form-crear-incidencia">
                <div>
                    <label for="select-articulo">Artículo que presenta el problema:</label>
                    <select id="select-articulo" name="id_articulo" required>
                        <option value="">Cargando artículos...</option>
                    </select>
                </div>
                <!-- Campo para Categorías -->
                <div>
                    <label for="select-categoria">Seleccionar Categoría de la Incidencia:</label>
                    <select id="select-categoria" required>
                        <option value="">-- Seleccionar --</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="descripcion-problema">Descripción del problema:</label><br>
                    <textarea id="descripcion-problema" rows="4" cols="50" placeholder="Detalle qué ocurre..."
                        required></textarea>
                </div>
                <br>
                <button type="submit">Guardar y Enviar Incidencia</button>
            </form>
        </section>
    </main>

    <script type="module" src="/sesion.js"></script>
    <script type="module" src="/empleado.js"></script>
</body>

</html>
